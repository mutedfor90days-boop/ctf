<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTF — Local 2 Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
  :root{--bg:#06090f;--blue:#00cfff;--red:#ff2244;--gold:#ffd700;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:#fff;font-family:'Share Tech Mono',monospace;
    height:100vh;overflow:hidden;user-select:none;display:flex;flex-direction:column;}

  #hud{display:flex;align-items:center;justify-content:space-between;
    padding:5px 18px;flex-shrink:0;background:rgba(0,0,0,.5);border-bottom:1px solid #0a1828;position:relative;}
  .hud-team{display:flex;align-items:center;gap:10px;font-family:'Orbitron',monospace;font-size:.72rem;font-weight:700;}
  .hud-score{font-size:1.5rem;}
  .hud-blue{color:var(--blue);text-shadow:0 0 10px var(--blue);}
  .hud-red {color:var(--red); text-shadow:0 0 10px var(--red);}
  #hud-center{display:flex;flex-direction:column;align-items:center;gap:2px;}
  #hud-time{font-family:'Orbitron',monospace;font-size:1rem;color:var(--gold);text-shadow:0 0 10px var(--gold);letter-spacing:.1em;}
  #hud-flash{font-size:.58rem;letter-spacing:.08em;opacity:.9;min-height:1em;color:#fff;text-align:center;}

  #game-area{flex:1;display:flex;min-height:0;}
  .view-wrap{flex:1;position:relative;overflow:hidden;}
  .view-wrap canvas{position:absolute;inset:0;width:100%;height:100%;}
  #divider{width:3px;background:linear-gradient(180deg,transparent,#1a3a5a 20%,#4a9adf 50%,#1a3a5a 80%,transparent);flex-shrink:0;}
  .corner-label{position:absolute;top:6px;left:6px;font-family:'Orbitron',monospace;font-size:.5rem;
    letter-spacing:.1em;padding:2px 8px;border:1px solid;pointer-events:none;}
  .cl-blue{color:var(--blue);border-color:var(--blue);background:rgba(0,200,255,.08);}
  .cl-red {color:var(--red); border-color:var(--red); background:rgba(255,34,68,.08);}
  .corner-ctrl{position:absolute;bottom:5px;left:6px;font-size:.48rem;opacity:.3;letter-spacing:.05em;}

  .overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:rgba(0,4,12,.95);backdrop-filter:blur(8px);}
  .obox{background:linear-gradient(135deg,#060f1c,#030810);border:1px solid #1a2a3a;
    box-shadow:0 0 60px rgba(0,200,255,.15);padding:36px 44px;text-align:center;max-width:480px;width:92vw;}
  .obox h2{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:900;letter-spacing:.16em;margin-bottom:6px;}
  .obox p{opacity:.5;font-size:.68rem;line-height:1.9;margin-bottom:16px;}
  .name-row{display:flex;gap:12px;margin-bottom:6px;}
  .name-wrap{flex:1;display:flex;flex-direction:column;gap:4px;}
  .name-lbl{font-size:.58rem;letter-spacing:.12em;opacity:.65;}
  .name-lbl.b{color:var(--blue);}  .name-lbl.r{color:var(--red);}
  input.nick{background:rgba(0,20,40,.8);border:1px solid #1a3a5a;color:#fff;
    font-family:'Share Tech Mono',monospace;font-size:.9rem;padding:9px 10px;width:100%;
    text-align:center;outline:none;transition:border-color .2s;}
  input.nick:focus{border-color:var(--blue);box-shadow:0 0 10px rgba(0,200,255,.2);}
  input.nick.r:focus{border-color:var(--red);box-shadow:0 0 10px rgba(255,34,68,.2);}
  input.nick::placeholder{opacity:.28;}
  .btn{font-family:'Orbitron',monospace;font-size:.72rem;font-weight:700;letter-spacing:.14em;
    border:none;cursor:pointer;padding:11px 28px;transition:all .15s;}
  .btn-go{background:linear-gradient(90deg,var(--blue),#0088dd);color:#000;width:100%;margin-top:4px;
    box-shadow:0 0 20px rgba(0,200,255,.3);}
  .btn-go:hover{background:linear-gradient(90deg,#fff,var(--blue));}
  .btn-sm{background:rgba(0,200,255,.12);color:var(--blue);border:1px solid var(--blue);
    font-size:.62rem;padding:8px 20px;margin:4px;}
  .btn-sm:hover{background:var(--blue);color:#000;}
  .winner-txt{font-family:'Orbitron',monospace;font-size:1.9rem;font-weight:900;margin:8px 0;}
  #back-link{position:fixed;top:8px;left:10px;z-index:200;font-size:.55rem;opacity:.35;
    color:inherit;text-decoration:none;letter-spacing:.1em;}
  #back-link:hover{opacity:.85;}
</style>
</head>
<body>
<a href="/" id="back-link">← ONLINE</a>

<div id="hud">
  <div class="hud-team hud-blue">
    <span class="hud-score" id="score-blue">0</span>
    <span id="name-blue">BLUE</span>
  </div>
  <div id="hud-center">
    <div id="hud-time">3:00</div>
    <div id="hud-flash"></div>
  </div>
  <div class="hud-team hud-red" style="flex-direction:row-reverse">
    <span class="hud-score" id="score-red">0</span>
    <span id="name-red">RED</span>
  </div>
</div>

<div id="game-area">
  <div class="view-wrap" id="wrap-blue">
    <canvas id="cv-blue"></canvas>
    <div class="corner-label cl-blue" id="lbl-blue">🔵 BLUE</div>
    <div class="corner-ctrl">WASD move · Q tag</div>
  </div>
  <div id="divider"></div>
  <div class="view-wrap" id="wrap-red">
    <canvas id="cv-red"></canvas>
    <div class="corner-label cl-red" id="lbl-red">🔴 RED</div>
    <div class="corner-ctrl">ARROWS move · / tag</div>
  </div>
</div>

<!-- Home -->
<div class="overlay" id="home-overlay">
  <div class="obox">
    <h2 style="background:linear-gradient(90deg,var(--blue),#fff 50%,var(--red));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">◈ LOCAL 2-PLAYER ◈</h2>
    <p>Split-screen · same keyboard<br>Blue: <b>WASD + Q to tag</b> &nbsp;·&nbsp; Red: <b>Arrows + / to tag</b></p>
    <div class="name-row">
      <div class="name-wrap">
        <div class="name-lbl b">🔵 BLUE</div>
        <input class="nick" id="nick-blue" maxlength="10" placeholder="BLUE NAME" autocomplete="off" spellcheck="false">
      </div>
      <div class="name-wrap">
        <div class="name-lbl r">🔴 RED</div>
        <input class="nick r" id="nick-red" maxlength="10" placeholder="RED NAME" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <button class="btn btn-go" onclick="startGame()">▶ START</button>
    <p style="margin-top:14px">Grab enemy flag · return to base · First to 5 wins</p>
  </div>
</div>

<!-- Game over -->
<div class="overlay" id="over-overlay" style="display:none">
  <div class="obox">
    <h2 id="over-title">GAME OVER</h2>
    <div class="winner-txt" id="over-winner"></div>
    <p id="over-score" style="margin-bottom:16px"></p>
    <button class="btn btn-sm" onclick="restartGame()">⚡ REMATCH</button>
    <button class="btn btn-sm" onclick="goHome()">⌂ HOME</button>
  </div>
</div>

<script>
// ═══ CONSTANTS ════════════════════════════════════════════════════
const TILE         = 20;
const COLS         = 48;   // smaller map (was 80)
const ROWS         = 30;   // smaller map (was 50)
const W            = COLS * TILE;   // 960
const H            = ROWS * TILE;   // 600
const SPEED        = 5.5;           // faster (was 3.8)
const SPEED_FLAG   = 3.8;           // flag carrier (was 2.8)
const PLAYER_SIZE  = 16;
const TAG_RANGE    = 52;            // slightly bigger hit window
const TAG_COOLDOWN = 55;
const FLAG_RETURN  = 180;           // frames (~3s at 60fps)
const FPS          = 60;
const MAX_SCORE    = 5;

const CLR = {
  bg:'#06090f', blue:'#00cfff', blueDark:'#004466',
  red:'#ff2244', redDark:'#550011',
  gold:'#ffd700', wall:'#1a2d40', wallStroke:'#2a4060',
};

// ═══ MAP ══════════════════════════════════════════════════════════
function makeWalls() {
  const C = COLS, R = ROWS;
  // Compact symmetric walls for smaller map
  return [
    // Side bunkers
    {x:4, y:6,  w:2, h:5}, {x:4, y:19, w:2, h:5},
    {x:C-6,y:6, w:2, h:5}, {x:C-6,y:19,w:2, h:5},
    // Mid-lane blockers
    {x:10,y:4, w:4,h:2}, {x:10,y:R-6,w:4,h:2},
    {x:C-14,y:4,w:4,h:2},{x:C-14,y:R-6,w:4,h:2},
    // Centre cross
    {x:C/2-2,y:R/2-3,w:4,h:6},
    // Quarter obstacles
    {x:Math.round(C*.25),y:Math.round(R*.3), w:3,h:4},
    {x:Math.round(C*.25),y:Math.round(R*.6), w:3,h:3},
    {x:Math.round(C*.72),y:Math.round(R*.3), w:3,h:4},
    {x:Math.round(C*.72),y:Math.round(R*.6), w:3,h:3},
  ];
}

const WALLS = makeWalls();
const RECTS = WALLS.map(w=>({x:w.x*TILE,y:w.y*TILE,w:w.w*TILE,h:w.h*TILE}));

const BLUE_SPAWN = {x: TILE*2 + PLAYER_SIZE/2, y: H/2};
const RED_SPAWN  = {x: W - TILE*2 - PLAYER_SIZE/2, y: H/2};
const BLUE_BASE  = {x: TILE*2, y: H/2};
const RED_BASE   = {x: W - TILE*2, y: H/2};

function collidesWall(px, py) {
  const h = PLAYER_SIZE/2;
  return RECTS.some(w => px-h < w.x+w.w && px+h > w.x && py-h < w.y+w.h && py+h > w.y);
}
function dist(a,b){ return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2); }

// ═══ STATE ════════════════════════════════════════════════════════
let game = null;

function makeGame(bName, rName) {
  return {
    phase: 'playing',
    tick: 0,
    timeLeft: 180,   // 3 minutes for smaller map
    scoreBlue: 0,
    scoreRed: 0,
    flash: '', flashTimer: 0,
    tagEffects: [],
    players: {
      blue: {
        team:'blue', name:bName,
        x:BLUE_SPAWN.x, y:BLUE_SPAWN.y,
        spawnX:BLUE_SPAWN.x, spawnY:BLUE_SPAWN.y,
        hasFlag:false, tagCooldown:0, tagPressed:false,
        keys:{up:false,down:false,left:false,right:false},
      },
      red: {
        team:'red', name:rName,
        x:RED_SPAWN.x, y:RED_SPAWN.y,
        spawnX:RED_SPAWN.x, spawnY:RED_SPAWN.y,
        hasFlag:false, tagCooldown:0, tagPressed:false,
        keys:{up:false,down:false,left:false,right:false},
      },
    },
    blueFlag:{ x:BLUE_BASE.x, y:BLUE_BASE.y, carriedBy:null, home:true, returnTimer:0 },
    redFlag: { x:RED_BASE.x,  y:RED_BASE.y,  carriedBy:null, home:true, returnTimer:0 },
  };
}

// ═══ CANVAS ═══════════════════════════════════════════════════════
const cvB = document.getElementById('cv-blue');
const cvR = document.getElementById('cv-red');
const ctxB = cvB.getContext('2d');
const ctxR = cvR.getContext('2d');

function resizeCanvases() {
  const wB = document.getElementById('wrap-blue');
  const wR = document.getElementById('wrap-red');
  cvB.width  = wB.clientWidth;  cvB.height = wB.clientHeight;
  cvR.width  = wR.clientWidth;  cvR.height = wR.clientHeight;
}
window.addEventListener('resize', resizeCanvases);

// ═══ INPUT ════════════════════════════════════════════════════════
const held = {};
window.addEventListener('keydown', e => {
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','/'].includes(e.key)) e.preventDefault();
  if(held[e.key]) return;   // ignore key-repeat for tag
  held[e.key] = true;
  syncKeys();
  if(game && game.phase==='playing') {
    if(e.key==='q'||e.key==='Q') game.players.blue.tagPressed = true;
    if(e.key==='/'||e.key==='?') game.players.red.tagPressed  = true;
  }
});
window.addEventListener('keyup', e => { held[e.key]=false; syncKeys(); });

function syncKeys() {
  if(!game) return;
  const b=game.players.blue, r=game.players.red;
  b.keys.up    = !!(held['w']||held['W']);
  b.keys.down  = !!(held['s']||held['S']);
  b.keys.left  = !!(held['a']||held['A']);
  b.keys.right = !!(held['d']||held['D']);
  r.keys.up    = !!held['ArrowUp'];
  r.keys.down  = !!held['ArrowDown'];
  r.keys.left  = !!held['ArrowLeft'];
  r.keys.right = !!held['ArrowRight'];
}

// ═══ PHYSICS ══════════════════════════════════════════════════════
function movePlayer(p) {
  const spd = p.hasFlag ? SPEED_FLAG : SPEED;
  const k = p.keys;
  let dx=0, dy=0;
  if(k.up)    dy -= spd;
  if(k.down)  dy += spd;
  if(k.left)  dx -= spd;
  if(k.right) dx += spd;
  if(dx && dy){ dx*=0.707; dy*=0.707; }
  const half = PLAYER_SIZE/2;
  const nx = Math.max(half, Math.min(W-half, p.x+dx));
  const ny = Math.max(half, Math.min(H-half, p.y+dy));
  if(!collidesWall(nx, p.y)) p.x=nx;
  if(!collidesWall(p.x, ny)) p.y=ny;
}

function doTag(attacker, defender) {
  if(attacker.tagCooldown > 0) return;
  const d = dist(attacker, defender);
  if(d > TAG_RANGE) return;
  attacker.tagCooldown = TAG_COOLDOWN;
  // Visual burst on attacker
  game.tagEffects.push({x:attacker.x,y:attacker.y,r:6,life:25,color:attacker.team==='blue'?CLR.blue:CLR.red});
  // Drop flag if carrying
  if(defender.hasFlag) {
    defender.hasFlag = false;
    // Figure out which flag the defender was carrying:
    // blue player carries redFlag, red player carries blueFlag
    const flag = defender.team==='blue' ? game.redFlag : game.blueFlag;
    flag.carriedBy = null;
    flag.x = defender.x; flag.y = defender.y;
    flag.home = false; flag.returnTimer = FLAG_RETURN;
  }
  // Send defender back to spawn
  game.tagEffects.push({x:defender.x,y:defender.y,r:22,life:35,color:defender.team==='blue'?CLR.blue:CLR.red});
  defender.x = defender.spawnX; defender.y = defender.spawnY;
  setFlash('💥 ' + defender.name + ' sent to spawn!');
}

function setFlash(msg){ game.flash=msg; game.flashTimer=150; }

// ═══ TICK ═════════════════════════════════════════════════════════
function gameTick() {
  if(!game || game.phase!=='playing') return;
  game.tick++;

  // Countdown timer
  if(game.tick % FPS === 0) {
    game.timeLeft--;
    if(game.timeLeft <= 0){ endGame(); return; }
  }

  const b=game.players.blue, r=game.players.red;
  const bf=game.blueFlag, rf=game.redFlag;

  movePlayer(b); movePlayer(r);

  // Process tags (tagPressed set on keydown, consumed here)
  if(b.tagPressed){ b.tagPressed=false; doTag(b,r); }
  if(r.tagPressed){ r.tagPressed=false; doTag(r,b); }
  if(b.tagCooldown>0) b.tagCooldown--;
  if(r.tagCooldown>0) r.tagCooldown--;

  // Flag pickup: blue grabs red flag
  if(!b.hasFlag && rf.carriedBy===null && dist(b,rf)<PLAYER_SIZE+12) {
    b.hasFlag=true; rf.carriedBy='blue'; rf.home=false; rf.returnTimer=0;
    setFlash('🔵 '+b.name+' grabbed the RED flag!');
  }
  // Flag pickup: red grabs blue flag
  if(!r.hasFlag && bf.carriedBy===null && dist(r,bf)<PLAYER_SIZE+12) {
    r.hasFlag=true; bf.carriedBy='red'; bf.home=false; bf.returnTimer=0;
    setFlash('🔴 '+r.name+' grabbed the BLUE flag!');
  }

  // Move flags with carriers
  if(rf.carriedBy==='blue'){ rf.x=b.x; rf.y=b.y; }
  if(bf.carriedBy==='red') { bf.x=r.x; bf.y=r.y; }

  // Auto-return dropped flags
  if(rf.carriedBy===null && !rf.home){ rf.returnTimer--; if(rf.returnTimer<=0){ rf.x=RED_BASE.x;rf.y=RED_BASE.y;rf.home=true;setFlash('🔴 Red flag returned!'); }}
  if(bf.carriedBy===null && !bf.home){ bf.returnTimer--; if(bf.returnTimer<=0){ bf.x=BLUE_BASE.x;bf.y=BLUE_BASE.y;bf.home=true;setFlash('🔵 Blue flag returned!'); }}

  // Capture: blue brings red flag to blue base
  if(b.hasFlag && dist(b,BLUE_BASE)<PLAYER_SIZE+16){
    b.hasFlag=false; rf.carriedBy=null; rf.home=true; rf.x=RED_BASE.x; rf.y=RED_BASE.y; rf.returnTimer=0;
    game.scoreBlue++;
    document.getElementById('score-blue').textContent = game.scoreBlue;
    setFlash('⭐ '+b.name+' scores! Blue: '+game.scoreBlue);
    if(game.scoreBlue>=MAX_SCORE){ endGame(); return; }
  }
  // Capture: red brings blue flag to red base
  if(r.hasFlag && dist(r,RED_BASE)<PLAYER_SIZE+16){
    r.hasFlag=false; bf.carriedBy=null; bf.home=true; bf.x=BLUE_BASE.x; bf.y=BLUE_BASE.y; bf.returnTimer=0;
    game.scoreRed++;
    document.getElementById('score-red').textContent = game.scoreRed;
    setFlash('⭐ '+r.name+' scores! Red: '+game.scoreRed);
    if(game.scoreRed>=MAX_SCORE){ endGame(); return; }
  }

  // Effects decay
  if(game.flashTimer>0) game.flashTimer--;
  for(let i=game.tagEffects.length-1;i>=0;i--){
    game.tagEffects[i].r+=2.5; game.tagEffects[i].life--;
    if(game.tagEffects[i].life<=0) game.tagEffects.splice(i,1);
  }

  // HUD
  const m=Math.floor(game.timeLeft/60), s=game.timeLeft%60;
  const te=document.getElementById('hud-time');
  te.textContent = m+':'+(s<10?'0':'')+s;
  te.style.color = game.timeLeft<=30?'#ff4444':CLR.gold;
  const fe=document.getElementById('hud-flash');
  fe.textContent = game.flashTimer>0 ? game.flash : '';
  fe.style.opacity = Math.min(1, game.flashTimer/30);
}

// ═══ RENDER ═══════════════════════════════════════════════════════
function renderView(ctx, team) {
  const vw=ctx.canvas.width, vh=ctx.canvas.height;
  if(vw===0||vh===0) return;
  const fp=game.players[team];
  if(!fp) return;

  // Camera: clamp so we don't show outside the map
  const camX = Math.max(0, Math.min(W-vw, fp.x - vw/2));
  const camY = Math.max(0, Math.min(H-vh, fp.y - vh/2));

  ctx.fillStyle=CLR.bg;
  ctx.fillRect(0,0,vw,vh);

  ctx.save();
  ctx.translate(-camX,-camY);

  // Grid
  ctx.strokeStyle='#0a1220'; ctx.lineWidth=0.5;
  const sx=Math.floor(camX/TILE)*TILE, sy=Math.floor(camY/TILE)*TILE;
  for(let x=sx;x<camX+vw+TILE;x+=TILE){ctx.beginPath();ctx.moveTo(x,camY);ctx.lineTo(x,camY+vh);ctx.stroke();}
  for(let y=sy;y<camY+vh+TILE;y+=TILE){ctx.beginPath();ctx.moveTo(camX,y);ctx.lineTo(camX+vw,y);ctx.stroke();}

  // Walls
  RECTS.forEach(w=>{
    ctx.fillStyle=CLR.wall; ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.strokeStyle=CLR.wallStroke; ctx.lineWidth=1; ctx.strokeRect(w.x,w.y,w.w,w.h);
  });

  // Bases
  [[BLUE_BASE,CLR.blue,'BLUE'],[RED_BASE,CLR.red,'RED']].forEach(([base,col,lbl])=>{
    ctx.save();
    ctx.shadowColor=col; ctx.shadowBlur=16;
    ctx.strokeStyle=col; ctx.lineWidth=2; ctx.globalAlpha=.55;
    ctx.strokeRect(base.x-24,base.y-24,48,48);
    ctx.globalAlpha=1; ctx.fillStyle=col+'18'; ctx.fillRect(base.x-24,base.y-24,48,48);
    ctx.shadowBlur=0; ctx.fillStyle=col; ctx.font='bold 9px Share Tech Mono'; ctx.textAlign='center';
    ctx.fillText(lbl,base.x,base.y+4);
    ctx.restore();
  });

  // Flags (only when not carried)
  drawFlag(ctx, game.blueFlag, CLR.blue);
  drawFlag(ctx, game.redFlag,  CLR.red);

  // Tag effects
  game.tagEffects.forEach(e=>{
    ctx.save();
    ctx.strokeStyle=e.color; ctx.lineWidth=2.5;
    ctx.globalAlpha=Math.max(0,e.life/35)*0.8;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  });

  // Tag range ring on focus player
  ctx.save();
  ctx.strokeStyle=CLR.gold; ctx.lineWidth=1; ctx.globalAlpha=0.12;
  ctx.setLineDash([3,5]);
  ctx.beginPath(); ctx.arc(fp.x,fp.y,TAG_RANGE,0,Math.PI*2); ctx.stroke();
  ctx.restore();

  // Players — enemy first so self renders on top
  const other = team==='blue' ? 'red' : 'blue';
  drawPlayer(ctx, game.players[other], false);
  drawPlayer(ctx, game.players[team],  true);

  ctx.restore();
}

function drawFlag(ctx, flag, col) {
  if(flag.carriedBy!==null) return;
  ctx.save();
  ctx.shadowColor=col; ctx.shadowBlur=12;
  ctx.globalAlpha=flag.home?1:0.55;
  ctx.fillStyle=col;
  // Diamond shape
  ctx.beginPath();
  ctx.moveTo(flag.x, flag.y-9);
  ctx.lineTo(flag.x+7, flag.y);
  ctx.lineTo(flag.x, flag.y+9);
  ctx.lineTo(flag.x-7, flag.y);
  ctx.closePath(); ctx.fill();
  if(!flag.home){
    const frac=Math.max(0,flag.returnTimer/FLAG_RETURN);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(flag.x-14,flag.y+12,28,3);
    ctx.fillStyle=col; ctx.fillRect(flag.x-14,flag.y+12,28*frac,3);
  }
  ctx.restore();
}

function drawPlayer(ctx, p, isMe) {
  const col  = p.team==='blue'?CLR.blue:CLR.red;
  const dark = p.team==='blue'?CLR.blueDark:CLR.redDark;
  const half = PLAYER_SIZE/2;
  ctx.save();

  // Body glow + fill
  ctx.shadowColor=col; ctx.shadowBlur=isMe?18:6;
  ctx.fillStyle=col; ctx.fillRect(p.x-half,p.y-half,PLAYER_SIZE,PLAYER_SIZE);
  ctx.shadowBlur=0;
  ctx.fillStyle=dark; ctx.fillRect(p.x-half+3,p.y-half+3,PLAYER_SIZE-6,PLAYER_SIZE-6);

  // Self outline
  if(isMe){ ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.strokeRect(p.x-half-2,p.y-half-2,PLAYER_SIZE+4,PLAYER_SIZE+4); }

  // Eyes (direction indicator)
  ctx.fillStyle='#fff';
  ctx.fillRect(p.x-4,p.y-2,3,3);
  ctx.fillRect(p.x+1,p.y-2,3,3);

  // Cooldown arc
  if(p.tagCooldown>0){
    ctx.save();
    ctx.strokeStyle=CLR.gold; ctx.lineWidth=2; ctx.globalAlpha=0.7;
    const frac=1-p.tagCooldown/TAG_COOLDOWN;
    ctx.beginPath(); ctx.arc(p.x,p.y,half+5,-Math.PI/2,-Math.PI/2+frac*Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // Carried flag pennant
  if(p.hasFlag){
    const fc=p.team==='blue'?CLR.red:CLR.blue;
    ctx.shadowColor=fc; ctx.shadowBlur=10; ctx.fillStyle=fc;
    ctx.fillRect(p.x-1,p.y-half-13,2,13);
    ctx.beginPath(); ctx.moveTo(p.x+1,p.y-half-13); ctx.lineTo(p.x+10,p.y-half-7); ctx.lineTo(p.x+1,p.y-half-1); ctx.closePath(); ctx.fill();
  }

  // Name label
  ctx.shadowBlur=0;
  const ly=p.y-half-(p.hasFlag?19:5);
  ctx.font=(isMe?'bold ':'')+' 8px Share Tech Mono'; ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillText(p.name,p.x+1,ly+1);
  ctx.fillStyle=isMe?'#fff':(p.team==='blue'?'#88eeff':'#ffaaaa');
  ctx.fillText(p.name,p.x,ly);

  ctx.restore();
}

// ═══ GAME OVER ════════════════════════════════════════════════════
function endGame() {
  game.phase='over';
  const winner = game.scoreBlue>game.scoreRed?'blue':game.scoreRed>game.scoreBlue?'red':'draw';
  const el=(id)=>document.getElementById(id);
  if(winner==='draw'){
    el('over-title').style.color=CLR.gold; el('over-title').textContent='🏳 DRAW!';
    el('over-winner').style.color=CLR.gold; el('over-winner').textContent='TIE GAME';
  } else if(winner==='blue'){
    el('over-title').style.color=CLR.blue; el('over-title').textContent='🔵 BLUE WINS!';
    el('over-winner').style.color=CLR.blue; el('over-winner').textContent=game.players.blue.name;
  } else {
    el('over-title').style.color=CLR.red; el('over-title').textContent='🔴 RED WINS!';
    el('over-winner').style.color=CLR.red; el('over-winner').textContent=game.players.red.name;
  }
  el('over-score').textContent='Blue '+game.scoreBlue+' – Red '+game.scoreRed;
  el('over-overlay').style.display='flex';
}

// ═══ LOOP ═════════════════════════════════════════════════════════
let lastTs=0;
const FRAME=1000/FPS;

function loop(ts) {
  requestAnimationFrame(loop);
  if(!game||game.phase!=='playing') return;
  if(ts-lastTs>=FRAME){
    lastTs=ts;
    gameTick();
    if(game.phase==='playing'){
      renderView(ctxB,'blue');
      renderView(ctxR,'red');
    }
  }
}

// ═══ UI ═══════════════════════════════════════════════════════════
function startGame() {
  const bn=document.getElementById('nick-blue').value.trim()||'BLUE';
  const rn=document.getElementById('nick-red').value.trim()||'RED';
  document.getElementById('home-overlay').style.display='none';
  document.getElementById('name-blue').textContent=bn;
  document.getElementById('name-red').textContent=rn;
  document.getElementById('lbl-blue').textContent='🔵 '+bn;
  document.getElementById('lbl-red').textContent='🔴 '+rn;
  document.getElementById('score-blue').textContent='0';
  document.getElementById('score-red').textContent='0';
  game=makeGame(bn,rn);
}

function restartGame() {
  const bn=game.players.blue.name, rn=game.players.red.name;
  document.getElementById('over-overlay').style.display='none';
  document.getElementById('score-blue').textContent='0';
  document.getElementById('score-red').textContent='0';
  document.getElementById('hud-time').textContent='3:00';
  game=makeGame(bn,rn);
}

function goHome() {
  game=null;
  document.getElementById('over-overlay').style.display='none';
  document.getElementById('home-overlay').style.display='flex';
}

document.getElementById('nick-blue').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('nick-red').focus();});
document.getElementById('nick-red').addEventListener('keydown',e=>{if(e.key==='Enter')startGame();});
document.getElementById('nick-blue').focus();

resizeCanvases();
requestAnimationFrame(loop);
</script>
